# .azure-pipelines.yml
# CI para Python (PEP 621) instalando el paquete y ejecutando pytest con cobertura

trigger:
  branches:
    include: [ main, develop, feature/* ]

pr:
  branches:
    include: [ main, develop ]

pool:
  vmImage: ubuntu-latest

strategy:
  matrix:
    Py313:
      PYTHON_VERSION: '3.13'

variables:
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip-cache
  TEST_RESULTS_DIR: $(System.DefaultWorkingDirectory)/test-results
  COVERAGE_XML: $(System.DefaultWorkingDirectory)/coverage.xml

steps:
- checkout: self
  fetchDepth: 1

- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(PYTHON_VERSION)'
  displayName: "Usar Python $(PYTHON_VERSION)"

- task: Cache@2
  inputs:
    key: 'pip | "$(Agent.OS)" | pyproject.toml'
    restoreKeys: 'pip | "$(Agent.OS)"'
    path: '$(PIP_CACHE_DIR)'
  displayName: "Restaurar cache pip"

- script: |
    python -m pip install --upgrade pip
    pip config set global.cache-dir "$(PIP_CACHE_DIR)"
    # Instala el paquete con extras de desarrollo (pytest, pytest-cov)
    pip install -e ".[dev]"
  displayName: "Instalar paquete y dependencias de desarrollo"

# Ejecutar pytest; si definiste [tool.pytest.ini_options], bastaría `pytest`
- script: |
    mkdir -p "$(TEST_RESULTS_DIR)"
    pytest --junitxml="$(TEST_RESULTS_DIR)/junit.xml"
  displayName: "Ejecutar pruebas (sin extras ml)"
  env:
    PYTHONWARNINGS: "ignore::DeprecationWarning"

- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '$(TEST_RESULTS_DIR)/junit.xml'
    failTaskOnFailedTests: true
  displayName: "Publicar resultados de pruebas"

- task: PublishCodeCoverageResults@2
  inputs:
    codeCoverageTool: 'Cobertura'
    summaryFileLocation: '$(COVERAGE_XML)'
    reportDirectory: '$(System.DefaultWorkingDirectory)'
  displayName: "Publicar cobertura"

# Fase 3.4 — Smoke test de entrenamiento ML (1 época, sin Comet para no requerir API key)
- script: |
    python training/train_classifier.py --epochs 1 --no-comet
  displayName: "Smoke test entrenamiento ML"
  env:
    PYTHONWARNINGS: "ignore::DeprecationWarning"
