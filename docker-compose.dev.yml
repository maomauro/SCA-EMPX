# Docker Compose para desarrollo local con hot-reload
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sca-backend-dev
    restart: unless-stopped
    environment:
      - DEBUG=true
      - DATABASE_URL=sqlite:///./backend/app/db/sqlite.db
      - SECRET_KEY=dev-secret-key-not-for-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - SIMILARITY_THRESHOLD=0.6
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      # Mount código para hot-reload
      - ./backend:/app/backend
      - ./main.py:/app/main.py
      # Volumen para DB
      - sqlite-data-dev:/app/backend/app/db
    ports:
      - "8000:8000"
    networks:
      - sca-network-dev
    command: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - mlflow

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sca-frontend-dev
    restart: unless-stopped
    volumes:
      # Mount archivos estáticos para cambios en vivo
      - ./backend/app/static:/usr/share/nginx/html
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sca-network-dev

  mlflow:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
    container_name: sca-mlflow-dev
    restart: unless-stopped
    environment:
      - MLFLOW_BACKEND_STORE_URI=file:///app/mlruns
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=file:///app/mlartifacts
    volumes:
      - mlflow-data-dev:/app/mlruns
      - mlflow-artifacts-dev:/app/mlartifacts
    ports:
      - "5000:5000"
    networks:
      - sca-network-dev

volumes:
  sqlite-data-dev:
    name: sca-sqlite-data-dev
  mlflow-data-dev:
    name: sca-mlflow-data-dev
  mlflow-artifacts-dev:
    name: sca-mlflow-artifacts-dev

networks:
  sca-network-dev:
    name: sca-network-dev
