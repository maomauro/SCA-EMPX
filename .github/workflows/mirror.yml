name: Mirror to Azure Repos

on:
  push:
    branches:
      - '**'             # dispara en cualquier rama
  schedule:
    - cron: "0 * * * *"  # cada hora (UTC)

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout (full history)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set git identity
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Add Azure Repos remote and push (header auth)
      env:
        AZURE_USER: ${{ secrets.AZURE_USER }}       # ← tu usuario Azure DevOps
        AZURE_PAT:  ${{ secrets.AZURE_PAT }}        # ← tu PAT
        AZURE_REPO_URL: ${{ secrets.AZURE_REPO_URL }}  # ← URL limpia al repo
      run: |
        set -e

        # 1) Asegurar remoto 'mirror' con URL LIMPIA (sin credenciales)
        if ! git remote | grep -q '^mirror$'; then
          git remote add mirror "$AZURE_REPO_URL"
        else
          git remote set-url mirror "$AZURE_REPO_URL"
        fi

        # 2) Construir Authorization: Basic base64(usuario:PAT)
        # (La opción -w0 no existe en macOS; por eso probamos y caemos a base64 normal)
        AUTH=$(printf "%s:%s" "$AZURE_USER" "$AZURE_PAT" | base64 -w0 2>/dev/null || printf "%s:%s" "$AZURE_USER" "$AZURE_PAT" | base64)

        echo "Validando acceso a Azure Repos..."
        git -c http.extraHeader="Authorization: Basic $AUTH" ls-remote "$AZURE_REPO_URL" > /dev/null

        echo "Empujando TODAS las ramas..."
        git -c http.extraHeader="Authorization: Basic $AUTH" push mirror --all

        echo "Empujando etiquetas..."
        git -c http.extraHeader="Authorization: Basic $AUTH" push mirror --tags
