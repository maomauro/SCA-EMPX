name: Mirror to Azure Repos

on:
  push:
    branches:
      - '**'             # dispara en cualquier rama
  schedule:
    - cron: "0 * * * *"  # cada hora (UTC)

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout (full history)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set git identity
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Add Azure Repos remote and push (header auth)
      env:
        AZURE_PAT:  ${{ secrets.AZURE_PAT }}
        AZURE_REPO_URL: ${{ secrets.AZURE_REPO_URL }}
      run: |
        # Añadir remoto 'mirror' a la URL limpia (sin credenciales)
        if ! git remote | grep -q '^mirror$'; then
          git remote add mirror "$AZURE_REPO_URL"
        else
          git remote set-url mirror "$AZURE_REPO_URL"
        fi

        # Construir el header Authorization: Basic base64(:PAT)
        AUTH=$(printf ":%s" "$AZURE_PAT" | base64)

        # Empujar TODAS las ramas y etiquetas usando el header
        git -c http.extraHeader="Authorization: Basic $AUTH" push mirror --all
        git -c http.extraHeader="Authorization: Basic $AUTH" push mirror --tags
