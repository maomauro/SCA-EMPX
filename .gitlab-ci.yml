# Variables requeridas en GitLab: CI/CD → Variables (masked/protected según necesidad)
# - CI_DOCKER_USERNAME   (Docker Hub o registry)
# - CI_DOCKER_PASSWORD  (masked)
# - SSH_PRIVATE_KEY     (deploy; clave privada SSH, tipo Variable o File)
# - STAGING_SERVER      (host para staging)
# - STAGING_USER        (usuario SSH staging)
# - PRODUCTION_SERVER   (host para producción)
# - PRODUCTION_USER     (usuario SSH producción)

variables:
  # Docker Registry
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: ${CI_DOCKER_USERNAME}
  DOCKER_PASSWORD: ${CI_DOCKER_PASSWORD}
  
  # Nombres de imágenes
  BACKEND_IMAGE: ${DOCKER_REGISTRY}/${DOCKER_USERNAME}/sca-empx-backend
  FRONTEND_IMAGE: ${DOCKER_REGISTRY}/${DOCKER_USERNAME}/sca-empx-frontend
  
  # Versión
  APP_VERSION: ${CI_COMMIT_SHORT_SHA}
  
  # Python
  PYTHON_VERSION: "3.13"
  
  # uv (doc: https://docs.astral.sh/uv/guides/integration/docker/)
  UV_VERSION: "0.10.7"
  BASE_LAYER: trixie-slim
  # GitLab CI: copiar en lugar de hard links para el directorio de build
  UV_LINK_MODE: copy

stages:
  - test
  - build
  - push
  - deploy

# Template para cache de dependencias
.python-cache:
  cache:
    key: ${CI_COMMIT_REF_SLUG}-python
    paths:
      - .venv/
      - .cache/

# ============================================
# STAGE: TEST
# ============================================

test:unit:
  stage: test
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-${BASE_LAYER}
  extends: .python-cache
  before_script:
    # Dependencias del sistema para opencv (tests API/unit)
    - apt-get update && apt-get install -y --no-install-recommends build-essential libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 libgl1
    # Sin extra [ml] para ahorrar espacio en runner (torch/tensorflow/deepface); tests ML se excluyen
    - uv sync --group dev
  script:
    # Solo tests unitarios en CI (sin [ml]); api/ml requieren torch/deepface (ver pyproject [project.optional-dependencies] ml)
    - uv run pytest backend/tests/unit/ -v --cov=backend --cov-report=xml --cov-report=term
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week
  only:
    - branches
    - merge_requests

lint:python:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install ruff
  script:
    - ruff check backend/ --output-format=gitlab > ruff-report.json 2>/dev/null || true
    - ruff check backend/ --statistics || true
  artifacts:
    when: always
    reports:
      codequality: ruff-report.json
    expire_in: 1 week
  allow_failure: true
  only:
    - branches
    - merge_requests

# ============================================
# STAGE: BUILD
# ============================================

build:backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
  script:
    - export BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    - export VCS_REF=${CI_COMMIT_SHORT_SHA}
    - |
      docker build \
        --build-arg APP_VERSION=${APP_VERSION} \
        --build-arg BUILD_DATE=${BUILD_DATE} \
        --build-arg VCS_REF=${VCS_REF} \
        -t ${BACKEND_IMAGE}:${APP_VERSION} \
        -t ${BACKEND_IMAGE}:latest \
        -f backend/Dockerfile \
        .
    - docker save ${BACKEND_IMAGE}:${APP_VERSION} -o backend-image.tar
  artifacts:
    paths:
      - backend-image.tar
    expire_in: 1 hour
  only:
    - main
    - develop
    - tags

build:frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
  script:
    - export BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    - export VCS_REF=${CI_COMMIT_SHORT_SHA}
    - |
      docker build \
        --build-arg APP_VERSION=${APP_VERSION} \
        --build-arg BUILD_DATE=${BUILD_DATE} \
        --build-arg VCS_REF=${VCS_REF} \
        -t ${FRONTEND_IMAGE}:${APP_VERSION} \
        -t ${FRONTEND_IMAGE}:latest \
        -f frontend/Dockerfile \
        .
    - docker save ${FRONTEND_IMAGE}:${APP_VERSION} -o frontend-image.tar
  artifacts:
    paths:
      - frontend-image.tar
    expire_in: 1 hour
  only:
    - main
    - develop
    - tags

# ============================================
# STAGE: PUSH
# ============================================

push:backend:
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  dependencies:
    - build:backend
  before_script:
    - docker load -i backend-image.tar
    - docker tag ${BACKEND_IMAGE}:${APP_VERSION} ${BACKEND_IMAGE}:latest
    - echo "${DOCKER_PASSWORD}" | docker login ${DOCKER_REGISTRY} -u "${DOCKER_USERNAME}" --password-stdin
  script:
    - docker push ${BACKEND_IMAGE}:${APP_VERSION}
    - docker push ${BACKEND_IMAGE}:latest
  after_script:
    - docker logout ${DOCKER_REGISTRY} || true
  only:
    - main
    - develop
    - tags

push:frontend:
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  dependencies:
    - build:frontend
  before_script:
    - docker load -i frontend-image.tar
    - docker tag ${FRONTEND_IMAGE}:${APP_VERSION} ${FRONTEND_IMAGE}:latest
    - echo "${DOCKER_PASSWORD}" | docker login ${DOCKER_REGISTRY} -u "${DOCKER_USERNAME}" --password-stdin
  script:
    - docker push ${FRONTEND_IMAGE}:${APP_VERSION}
    - docker push ${FRONTEND_IMAGE}:latest
  after_script:
    - docker logout ${DOCKER_REGISTRY} || true
  only:
    - main
    - develop
    - tags

# ============================================
# STAGE: DEPLOY
# ============================================

deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $STAGING_SERVER >> ~/.ssh/known_hosts
  script:
    - |
      ssh $STAGING_USER@$STAGING_SERVER << EOF
        cd /opt/sca-empx
        export DOCKER_REGISTRY=$DOCKER_REGISTRY
        export DOCKER_USERNAME=$DOCKER_USERNAME
        export APP_VERSION=$APP_VERSION
        docker compose -f docker-compose.prod.yml pull
        docker compose -f docker-compose.prod.yml up -d
        docker compose -f docker-compose.prod.yml ps
      EOF
  environment:
    name: staging
    url: http://$STAGING_SERVER
  only:
    - develop
  when: manual

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $PRODUCTION_SERVER >> ~/.ssh/known_hosts
  script:
    - |
      ssh $PRODUCTION_USER@$PRODUCTION_SERVER << EOF
        cd /opt/sca-empx
        export DOCKER_REGISTRY=$DOCKER_REGISTRY
        export DOCKER_USERNAME=$DOCKER_USERNAME
        export APP_VERSION=$APP_VERSION
        docker compose -f docker-compose.prod.yml pull
        docker compose -f docker-compose.prod.yml up -d
        docker compose -f docker-compose.prod.yml ps
      EOF
  environment:
    name: production
    url: http://$PRODUCTION_SERVER
  only:
    - main
    - tags
  when: manual
