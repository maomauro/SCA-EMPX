[project]
name = "sca-empx"
version = "0.1.0"
description = "Sistema de Control de Acceso Físico y Registro de Ingresos/Salidas - STI S.A.S."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "absl-py==2.4.0",
    "astunparse==1.6.3",
    "beautifulsoup4==4.14.3",
    "blinker==1.9.0",
    "charset-normalizer==3.4.4",
    "deepface==0.0.98",
    "filelock==3.24.2",
    "fire==0.7.1",
    "flask==3.1.2",
    "flask-cors==6.0.2",
    "flatbuffers==25.12.19",
    "fsspec==2026.2.0",
    "gast==0.7.0",
    "gdown==5.2.1",
    "google-pasta==0.2.0",
    "grpcio==1.78.0",
    "gunicorn==25.1.0",
    "h5py==3.15.1",
    "hf-xet==1.2.0",
    "huggingface-hub==1.4.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "joblib==1.5.3",
    "keras==3.13.2",
    "libclang==18.1.1",
    "lightdsa==0.0.3",
    "lightecc==0.0.4",
    "lightphe==0.0.20",
    "lz4==4.4.5",
    "markdown==3.10.2",
    "markdown-it-py==4.0.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "ml-dtypes==0.5.4",
    "mpmath==1.3.0",
    "mtcnn==1.0.0",
    "namex==0.1.0",
    "networkx==3.6.1",
    "onnxruntime==1.24.1",
    "opencv-python==4.13.0.92",
    "opt-einsum==3.4.0",
    "optree==0.18.0",
    "protobuf==6.33.5",
    "pysocks==1.7.1",
    "python-dateutil==2.9.0.post0",
    "requests==2.32.5",
    "retina-face==0.0.17",
    "rich==14.3.2",
    "setuptools==82.0.0",
    "shellingham==1.5.4",
    "soupsieve==2.8.3",
    "sympy==1.14.0",
    "tensorboard==2.20.0",
    "tensorboard-data-server==0.7.2",
    "tensorflow==2.20.0",
    "termcolor==3.3.0",
    "tf-keras==2.20.1",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "tqdm==4.67.3",
    "typer==0.24.0",
    "typer-slim==0.24.0",
    "tzdata==2025.3",
    "urllib3==2.6.3",
    "werkzeug==3.1.5",
    "wheel==0.46.3",
    "wrapt==2.1.1",
    "mlflow>=3.10.0",
    "scikit-learn>=1.3.0",
]
# Dependencias pesadas (torch/tensorflow/deepface): opcionales para CI; en Docker/local instalar con [ml]
[project.optional-dependencies]
ml = [
    "deepface>=0.0.79",
    "tf-keras>=2.0.0",
    "huggingface-hub>=1.4.1",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "onnxruntime>=1.24.1",
    "mlflow>=2.10.0",
    "comet-ml>=3.35.0",
    "scikit-learn>=1.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.1",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "slow: tests que cargan modelos ML pesados (HuggingFace o DeepFace). Omitir con -m 'not slow'.",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "B905",   # zip() sin strict= — aceptable en código de ciencia de datos
]
